<script>
let D=null, AQ=null, notifOn=localStorage.getItem('sabi_notif')==='1', qyteti='Tiranë, Shqipëri', lat=41.3275, lon=19.8187, ditaZgjedhur=0, deferredPrompt=null, infoIP='', motiVideo='diell', rrufeTimer=null;

function em(k){if(k===0)return"☀️";if(k===1||k===2)return"🌤️";if(k===3)return"☁️";if(k===45||k===48)return"🌫️";if(k>=51&&k<=57)return"🌦️";if(k>=61&&k<=67)return"🌧️";if(k>=71&&k<=77)return"❄️";if(k>=80&&k<=82)return"🌧️";if(k>=95)return"⛈️";return"🌤️"}

// ===== VIDEO LIVE - CANVAS SHI / BORE =====
const canvas=document.getElementById('canvasShi'), ctx=canvas.getContext('2d');
let W,H,pika=[];
function resizeCanvas(){ W=canvas.width=canvas.offsetWidth; H=canvas.height=canvas.offsetHeight; }
window.addEventListener('resize',resizeCanvas); setTimeout(resizeCanvas,200);
function krijoPika(n){ pika=[]; for(let i=0;i<n;i++) pika.push({x:Math.random()*W,y:Math.random()*H,v:4+Math.random()*6,s:1+Math.random()*2}); }
function vizatoShi(){
  ctx.clearRect(0,0,W,H);
  if(motiVideo==='shi'||motiVideo==='stuhi'){
    ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=1.5;
    pika.forEach(p=>{ ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-2,p.y+18); ctx.stroke(); p.y+=p.v; p.x-=1; if(p.y>H){p.y=-20;p.x=Math.random()*W;} });
  }
  if(motiVideo==='bore'){
    ctx.fillStyle='#fff';
    pika.forEach(p=>{ ctx.beginPath(); ctx.arc(p.x,p.y,p.s,0,Math.PI*2); ctx.fill(); p.y+=p.v*0.5; p.x+=Math.sin(p.y/20)*0.5; if(p.y>H){p.y=-10;p.x=Math.random()*W;} });
  }
  requestAnimationFrame(vizatoShi);
}
vizatoShi();

// ===== FUNKSIONI QE LIDH VIDEON ME MOTIN REAL =====
function ndryshoVideo(m, shiPerqind){
  motiVideo=m;
  if(rrufeTimer) clearInterval(rrufeTimer);
  const scene=document.getElementById('scene'), njeriu=document.getElementById('njeriu'), trupi=document.getElementById('trupi'), fjala=document.getElementById('fjala'), statusi=document.getElementById('statusiTekst'), statusiShi=document.getElementById('statusiShi');
  scene.className='scene '+m;
  document.getElementById('dielli').style.display = m==='diell' ? 'block' : 'none';
  document.getElementById('hena').style.display = m==='nate' ? 'block' : 'none';
  document.getElementById('re1').style.display = (m==='re'||m==='shi'||m==='stuhi') ? 'block' : 'none';
  document.getElementById('re2').style.display = (m==='re'||m==='shi'||m==='stuhi') ? 'block' : 'none';
  njeriu.className='njeriu ecen'; njeriu.classList.remove('me-cadra'); document.getElementById('cadra').innerText='☂️';
  statusiShi.innerText='🌧️ '+(shiPerqind||0)+'% Shi';
  if(m==='diell'){ trupi.innerText='🚶‍♂️'; fjala.innerText='☀️ Ditë e mirë, po ecën SABI!'; statusi.innerText='🚶‍♂️ SABI po ecën ngadalë...'; krijoPika(0); }
  if(m==='re'){ trupi.innerText='🚶‍♂️'; fjala.innerText='☁️ Pak re, por prapë po ecën!'; statusi.innerText='🚶‍♂️ SABI po ecën...'; krijoPika(0); }
  if(m==='shi'){ njeriu.classList.add('me-cadra'); trupi.innerText='🚶‍♂️'; fjala.innerText='🌧️ Hapa çadrën! Po bie shi!'; statusi.innerText='☂️ SABI hapi çadrën dhe po ecën...'; krijoPika(80); }
  if(m==='stuhi'){
    njeriu.className='njeriu vrapon me-cadra'; trupi.innerText='🏃‍♂️'; fjala.innerText='⛈️ Shumë shi! Po vrapoj!'; statusi.innerText='🏃‍♂️ SABI po Vrapon! Stuhi!'; krijoPika(180);
    rrufeTimer=setInterval(()=>{ if(motiVideo!=='stuhi') return; const r=document.getElementById('rrufe'), f=document.getElementById('flash'); r.classList.remove('show'); f.classList.remove('show'); void r.offsetWidth; r.classList.add('show'); f.classList.add('show'); }, 2200);
    setTimeout(()=>{ if(motiVideo==='stuhi'){ document.getElementById('cadra').innerText='🌂💨'; fjala.innerText='💨 Era ma mori çadrën!'; statusi.innerText='💦 SABI u lag! Po vrapon në shtëpi!'; trupi.innerText='🏃‍♂️💦'; } }, 4000);
  }
  if(m==='bore'){ trupi.innerText='🚶‍♂️'; fjala.innerText='❄️ Po bie borë! Sa bukur!'; statusi.innerText='❄️ SABI po ecën në borë...'; krijoPika(90); }
  if(m==='nate'){ trupi.innerText='🚶‍♂️'; fjala.innerText='🌙 Natë e qetë, po ecën SABI!'; statusi.innerText='🌙 SABI po ecën natën...'; krijoPika(0); }
}

function updateSw(){ document.getElementById('sw').classList.toggle('on',notifOn); document.getElementById('notifStatus').innerText=notifOn?'✅ I ndezur • Do të njoftohesh':'Prek për ta ndezur'; document.getElementById('notifTekst').innerText=notifOn?'🔔 Njoftime ON':'🔔 Njoftime Shi & Stuhi'; }
function toggleNotif(){ if(!notifOn){ notifOn=true; localStorage.setItem('sabi_notif','1'); updateSw(); document.getElementById('popupNotif').classList.add('show'); if('Notification' in window && Notification.permission==='default'){ Notification.requestPermission().then(p=>{ if(p==='granted') new Notification('SABIMOTI 🔔',{body:'Njoftimet u ndezën!'}); }); } } else { notifOn=false; localStorage.setItem('sabi_notif','0'); updateSw(); toast('🔕 Njoftimet u fikën'); } }
function konfirmoNotif(){ document.getElementById('popupNotif').classList.remove('show'); toast('✅ Njoftimet janë ON!'); }
function mbyllPopup(){ document.getElementById('popupNotif').classList.remove('show'); }
function alarm(d,emri){ const k=d.daily.weather_code[ditaZgjedhur], shi=d.daily.precipitation_probability_max[ditaZgjedhur]||0, box=document.getElementById('alertBox'); let h='',c=''; if(k>=95){c='stuhi';h='⛈️ ALERT STUHI! Stuhi në '+emri+'. Qëndro brenda! Prek për SMS →';} else if(k>=61||shi>=70){c='shi';h='🌧️ ALERT SHI! Shi në '+emri+' ('+shi+'%). Merr çadër!';} else if(k>=71&&k<=77){c='bore';h='❄️ ALERT BORË! Borë në '+emri;} else if(k===0 && ditaZgjedhur===0){c='mire';h='☀️ Ditë e mirë! Diell në '+emri;} if(h){box.className='alert show '+c;box.innerText=h;} else {box.className='alert';box.innerText='';} }
function tekstMoti(){ if(!D) return 'SABIMOTI - Shiko motin'; const dt=new Date(D.daily.time[ditaZgjedhur]+'T12:00:00'); return `SABIMOTI 🇦🇱\n📍 ${qyteti} - ${ditetPlot[dt.getDay()]} ${dt.getDate()} ${muajt[dt.getMonth()]}\n${em(D.daily.weather_code[ditaZgjedhur])} ${pr(D.daily.weather_code[ditaZgjedhur])}\n🌡️ Max: ${Math.round(D.daily.temperature_2m_max[ditaZgjedhur])}° / Min: ${Math.round(D.daily.temperature_2m_min[ditaZgjedhur])}°\n🌧️ Shi: ${D.daily.precipitation_probability_max[ditaZgjedhur]||0}% • 💨 Era: ${Math.round(D.daily.wind_speed_10m_max[ditaZgjedhur])} km/h\nBY SABI`; }
function dergoSMS(){ window.location.href='sms:?&body='+encodeURIComponent(tekstMoti()); toast('📩 U hap SMS!'); }
function dergoWhatsApp(){ window.open('https://wa.me/?text='+encodeURIComponent(tekstMoti()),'_blank'); }
function shperndaje(){ if(navigator.share){ navigator.share({title:'SABIMOTI', text:tekstMoti(), url:location.href}).catch(()=>kopjoLink()); } else kopjoLink(); }
function kopjoLink(){ if(navigator.clipboard) navigator.clipboard.writeText(location.href).then(()=>toast('🔗 Linku u kopjua!')); }
function hapHarten(){ window.open(`https://www.google.com/maps/search/?api=1&query=${lat},${lon}`,'_blank'); }
function zgjidhQytetNgaLista(){ const v=document.getElementById('qytetSelect').value; if(!v) return; const p=v.split(','); merrMotin(parseFloat(p[0]),parseFloat(p[1]),p[2]+', Shqipëri'); }
async function merrIP(){ try{ const r=await fetch('https://ipapi.co/json/'); const j=await r.json(); infoIP=`${j.city||''} • ${j.country_name||''}`; }catch(e){ infoIP=''; } if(D) render(); }
async function merrMotin(la,lo,emri){
  lat=la; lon=lo; qyteti=emri; ditaZgjedhur=0;
  document.getElementById('content').innerHTML='<div class="load">Duke ngarkuar...</div>';
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,pressure_msl,uv_index,is_day&hourly=temperature_2m,weather_code,precipitation_probability,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset,weather_code,uv_index_max&timezone=auto&forecast_days=7`;
    const r=await fetch(url); if(!r.ok) throw new Error('net'); const d=await r.json(); D=d;
    try{ const ra=await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${la}&longitude=${lo}&current=us_aqi&domains=cams`); AQ=await ra.json(); }catch(e){ AQ=null; }
    render();
  }catch(e){ document.getElementById('content').innerHTML='<div class="err">❌ Pa internet! Shtyp Rifresko.</div>'; }
}
function render(){
  const d=D;
  const kDite=d.daily.weather_code[ditaZgjedhur];
  const maxDite=d.daily.temperature_2m_max[ditaZgjedhur], minDite=d.daily.temperature_2m_min[ditaZgjedhur];
  const shiDite=d.daily.precipitation_probability_max[ditaZgjedhur]||0, eraDite=d.daily.wind_speed_10m_max[ditaZgjedhur], uvDite=d.daily.uv_index_max[ditaZgjedhur]||0;
  const dtZg=new Date(d.daily.time[ditaZgjedhur]+'T12:00:00');
  const eshteSot=ditaZgjedhur===0;
  const tempMadhe=eshteSot?Math.round(d.current.temperature_2m):Math.round(maxDite);
  const ndjehet=eshteSot?`Ndjehet si ${Math.round(d.current.apparent_temperature)}°`:`Min ${Math.round(minDite)}° • Max ${Math.round(maxDite)}°`;
  const oraAktuale=new Date(d.current.time).getHours();
  // LIDH VIDEON ME DITEN E ZGJEDHUR - KJO ESHTE LIDHJA
  let videoM='diell';
  if(!eshteSot){ if(kDite===0) videoM='diell'; else if(kDite<=3) videoM='re'; else if(kDite>=71&&kDite<=77) videoM='bore'; else if(kDite>=95) videoM='stuhi'; else if(kDite>=51) videoM='shi'; }
  else { if(d.current.is_day===0) videoM='nate'; else if(d.current.weather_code===0) videoM='diell'; else if(d.current.weather_code<=3) videoM='re'; else if(d.current.weather_code>=71&&d.current.weather_code<=77) videoM='bore'; else if(d.current.weather_code>=95) videoM='stuhi'; else if(d.current.weather_code>=51) videoM='shi'; }
  ndryshoVideo(videoM, shiDite);
  // Update VIDEO INFO
  document.getElementById('liveQytet').innerText=qyteti.split(',')[0];
  document.getElementById('liveCond').innerText=pr(kDite)+' • '+(eshteSot?'SOT':ditetPlot[dtZg.getDay()]);
  document.getElementById('liveTemp').innerText=tempMadhe;
  alarm(d,qyteti);
  const ditaData=d.daily.time[ditaZgjedhur]; let hr=''; d.hourly.time.forEach((t,i)=>{ if(!t.startsWith(ditaData)) return; const dt=new Date(t); const eshteTani=eshteSot&&dt.getHours()===oraAktuale; hr+=`<div class="hour ${eshteTani?'now':''}"><div style="font-size:11px">${dt.getHours()}:00</div><div class="em">${em(d.hourly.weather_code[i])}</div><b>${Math.round(d.hourly.temperature_2m[i])}°</b><div style="font-size:10px">🌧️ ${d.hourly.precipitation_probability[i]||0}%</div><div style="font-size:10px">💨 ${Math.round(d.hourly.wind_speed_10m[i])}</div></div>`; });
  let dy=''; d.daily.time.forEach((t,i)=>{ const dt=new Date(t+'T12:00:00'); dy+=`<div class="card day ${i===ditaZgjedhur?'active':''}" onclick="zgjidh(${i},this)"><div class="l"><b>${i===0?'SOT':ditet[dt.getDay()]}</b><span>${dt.getDate()} ${muajt[dt.getMonth()]}</span></div><div class="e">${em(d.daily.weather_code[i])}</div><div class="m">${pr(d.daily.weather_code[i])}<div class="bar"><i style="width:${d.daily.precipitation_probability_max[i]||0}%"></i></div><span style="font-size:11px">🌧️ ${d.daily.precipitation_probability_max[i]||0}% • 💨 ${Math.round(d.daily.wind_speed_10m_max[i])} km/h • ☀️ UV ${Math.round(d.daily.uv_index_max[i]||0)}</span></div><div class="t"><b>${Math.round(d.daily.temperature_2m_max[i])}°</b> <span style="opacity:.7">${Math.round(d.daily.temperature_2m_min[i])}°</span></div></div>`; });
  const aqi=AQ?.current?AQ.current.us_aqi:'--'; const aqiTxt=aqi==='--'?'N/A':aqi<=50?'🟢 E mirë':aqi<=100?'🟡 Mesatare':'🔴 E keqe';
  const hena=['🌑 Hënë e Re','🌒','🌓','🌔','🌕 Hënë e Plotë','🌖','🌗','🌘'][new Date().getDate()%8];
  const veshja=maxDite>25?'👕 T-shirt':maxDite>15?'🧥 Xhaketë e lehtë':maxDite>5?'🧥 Pallto':'🧥🧣 Pallto + Shall';
  document.getElementById('content').innerHTML=`
  <div class="card" style="margin-top:4px"><div class="title">${eshteSot?'Sot - Orë për Orë':ditetPlot[dtZg.getDay()]+' - Orë për Orë'} <span style="color:#FFD700">👆 Kliko ditë tjetër</span></div><div class="hourly">${hr}</div></div>
  <div class="stats"><div class="stat"><span style="font-size:20px">💨</span><div><b>${eshteSot?Math.round(d.current.wind_speed_10m)+' km/h':Math.round(eraDite)+' km/h max'}</b><span>Era</span></div></div><div class="stat"><span style="font-size:20px">💧</span><div><b>${eshteSot?d.current.relative_humidity_2m+'%':'—'}</b><span>Lagështia</span></div></div><div class="stat"><span style="font-size:20px">🌡️</span><div><b>${eshteSot?Math.round(d.current.pressure_msl)+' hPa':Math.round(maxDite)+'° / '+Math.round(minDite)+'°'}</b><span>${eshteSot?'Presioni':'Max / Min'}</span></div></div><div class="stat"><span style="font-size:20px">🌧️</span><div><b>${shiDite}%</b><span>Shi</span></div></div><div class="stat"><span style="font-size:20px">🌅</span><div><b>${d.daily.sunrise[ditaZgjedhur].slice(11,16)}</b><span>Lindja</span></div></div><div class="stat"><span style="font-size:20px">🌇</span><div><b>${d.daily.sunset[ditaZgjedhur].slice(11,16)}</b><span>Perëndimi</span></div></div><div class="stat"><span style="font-size:20px">☀️</span><div><b>UV ${Math.round(uvDite)}</b><span>UV</span></div></div><div class="stat"><span style="font-size:20px">😷</span><div><b>AQI ${aqi} • ${aqiTxt}</b><span>Ajri</span></div></div><div class="stat"><span style="font-size:20px">🌙</span><div><b>${hena}</b><span>Hëna</span></div></div><div class="stat"><span style="font-size:20px">👕</span><div><b>${veshja}</b><span>Çfarë të veshësh</span></div></div></div>
  <div class="card" style="margin-top:10px"><div class="title">Grafik 7 Ditë <span>BY SABI</span></div><canvas id="graf" width="440" height="150"></canvas></div>
  <div style="margin-top:14px;font-weight:800;font-size:14px">👆 Kliko një ditë - ndryshon komplet faqja + VIDEO:</div><div class="days">${dy}</div><div id="detaje" class="card detail" style="margin-top:10px"></div>`;
  zgjidhDetaje(); vizato();
}
function vizato(){ const c=document.getElementById('graf'); if(!c) return; const ctx=c.getContext('2d'); const W=c.width,H=c.height; ctx.clearRect(0,0,W,H); const maxs=D.daily.temperature_2m_max, mins=D.daily.temperature_2m_min; const all=[...maxs,...mins]; const mn=Math.min(...all)-2,mx=Math.max(...all)+2; const X=i=>30+i*(W-50)/6,Y=v=>H-25-(v-mn)/(mx-mn)*(H-50); ctx.strokeStyle='rgba(255,255,255,.2)'; for(let i=0;i<4;i++){const y=20+i*(H-40)/3;ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(W-10,y);ctx.stroke()} function vl(data,color){ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();data.forEach((v,i)=>{if(i===0)ctx.moveTo(X(i),Y(v));else ctx.lineTo(X(i),Y(v))});ctx.stroke();ctx.fillStyle=color;data.forEach((v,i)=>{ctx.beginPath();ctx.arc(X(i),Y(v),5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.fillText(Math.round(v)+'°',X(i)-10,Y(v)-10);ctx.fillStyle=color})} vl(maxs,'#FFD700'); vl(mins,'#38BDF8'); ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; D.daily.time.forEach((t,i)=>{const dt=new Date(t+'T12:00:00');ctx.fillText(ditet[dt.getDay()],X(i)-12,H-6)}); }
function zgjidh(i,el){ ditaZgjedhur=i; document.querySelectorAll('.day').forEach(c=>c.classList.remove('active')); if(el) el.classList.add('active'); render(); const dt=new Date(D.daily.time[i]+'T12:00:00'); toast('📅 '+ditetPlot[dt.getDay()]+' - VIDEO + Faqja u ndryshuan!'); window.scrollTo({top:0,behavior:'smooth'}); }
function zgjidhDetaje(){ const d=D; const dt=new Date(d.daily.time[ditaZgjedhur]+'T12:00:00'); const el=document.getElementById('detaje'); if(!el) return; el.innerHTML=`<h3>${ditaZgjedhur===0?'SOT - ':''}${ditetPlot[dt.getDay()]} • ${dt.getDate()} ${muajt[dt.getMonth()]}</h3><p>${em(d.daily.weather_code[ditaZgjedhur])} ${pr(d.daily.weather_code[ditaZgjedhur])}<br>🌡️ Max ${Math.round(d.daily.temperature_2m_max[ditaZgjedhur])}° / Min ${Math.round(d.daily.temperature_2m_min[ditaZgjedhur])}° • 🌧️ ${d.daily.precipitation_probability_max[ditaZgjedhur]||0}% • 💨 ${Math.round(d.daily.wind_speed_10m_max[ditaZgjedhur])} km/h<br>🌅 ${d.daily.sunrise[ditaZgjedhur].slice(11,16)} • 🌇 ${d.daily.sunset[ditaZgjedhur].slice(11,16)}<br><br><button onclick="dergoSMS()" style="background:#0ea5e9;color:#fff;border:none;padding:10px 16px;border-radius:100px;font-weight:800;cursor:pointer">📩 SMS</button> <button onclick="dergoWhatsApp()" style="background:#22c55e;color:#fff;border:none;padding:10px 16px;border-radius:100px;font-weight:800;cursor:pointer">💬 WhatsApp</button> ${ditaZgjedhur!==0?`<button onclick="kthehuSot()" style="background:#FFD700;color:#000;border:none;padding:10px 16px;border-radius:100px;font-weight:800;cursor:pointer;margin-top:8px">↩ Kthehu te SOT</button>`:''}</p>`; }
function kthehuSot(){ ditaZgjedhur=0; render(); toast('📍 U ktheve te SOT'); window.scrollTo({top:0,behavior:'smooth'}); }
async function kerko(){ const q=document.getElementById('cityInput').value.trim(); if(!q){toast('Shkruaj qytetin!');return} try{ const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=sq&format=json`); const j=await r.json(); if(j.results?.length>0){const x=j.results[0]; merrMotin(x.latitude,x.longitude,x.name+', '+(x.country||''));} else toast('❌ Qyteti nuk u gjet!'); }catch(e){toast('❌ Pa internet!')} }
function gps(){ if(!navigator.geolocation){toast('GPS nuk mbështetet');return} toast('📍 Duke marrë GPS...'); navigator.geolocation.getCurrentPosition(p=>{ merrMotin(p.coords.latitude,p.coords.longitude,'Vendndodhja Ime'); toast('✅ GPS u gjet!'); },()=>toast('❌ Lejo GPS!')); }
function rifresko(){ merrMotin(lat,lon,qyteti); toast('🔄 U rifreskua'); }
function ndryshoMode(){ const b=document.getElementById('body'); const l=b.classList.toggle('light'); document.getElementById('modeBtn').innerText=l?'☀️':'🌙'; localStorage.setItem('sabi_mode',l?'light':'dark'); }
if(localStorage.getItem('sabi_mode')==='light'){ document.getElementById('body').classList.add('light'); document.getElementById('modeBtn').innerText='☀️'; }
document.getElementById('cityInput').addEventListener('keydown',e=>{ if(e.key==='Enter') kerko(); });
updateSw(); merrIP(); merrMotin(41.3275,19.8187,'Tiranë, Shqipëri');
</script>
